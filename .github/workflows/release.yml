name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar clave fija de firma
        run: |
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK Debug
        run: flutter build apk --debug

      - name: Renombrar APK a svfc.apk
        run: mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/svfc.apk

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/svfc.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}